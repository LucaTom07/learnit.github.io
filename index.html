<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parla – Learn Italian</title><meta name="theme-color" content="#58cc02"><link rel="manifest" href="manifest.webmanifest"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Parla"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#fff;--fg:#1f2937;--mu:#6b7280;--card:#f3f4f6;--bd:#e5e7eb;--g:#58cc02;--gd:#46a302;--r:#ff4b4b;--b:#1cb0f6;--y:#ffc800;--gbg:#d7ffb8;--rbg:#ffdfe0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131f24;--fg:#f1f5f9;--mu:#94a3b8;--card:#1f2f36;--bd:#37464f;--gbg:#1f3d1a;--rbg:#4a2024}}
:root[data-theme="dark"]{--bg:#131f24;--fg:#f1f5f9;--mu:#94a3b8;--card:#1f2f36;--bd:#37464f;--gbg:#1f3d1a;--rbg:#4a2024}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100vh;padding:14px 16px 90px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:800;gap:8px}
.top span{font-size:17px}
h1{font-size:26px;margin:18px 0 4px}p.s{color:var(--mu);margin:0 0 16px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:16px;background:var(--g);color:#fff;font:800 16px inherit;letter-spacing:.5px;text-transform:uppercase;box-shadow:0 4px 0 var(--gd);cursor:pointer}
.btn:disabled{background:var(--bd);color:var(--mu);box-shadow:none}
.btn.red{background:var(--r);box-shadow:0 4px 0 #c33}
.bar{flex:1;height:14px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);transition:width .3s}
.x{background:none;border:0;font-size:22px;color:var(--mu);cursor:pointer}
.q{font-size:22px;font-weight:800;margin:26px 0 6px}.lab{color:var(--mu);font-weight:600}
.say{display:inline-flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:10px 16px;font:800 24px inherit;color:var(--b);margin:12px 0 16px;cursor:pointer}
.opt{display:block;width:100%;text-align:left;padding:14px;margin-bottom:10px;border:2px solid var(--bd);border-bottom-width:4px;border-radius:14px;background:var(--bg);color:var(--fg);font:600 17px inherit;cursor:pointer}
.opt.sel{border-color:var(--b);background:color-mix(in srgb,var(--b) 15%,var(--bg))}
.ans{min-height:64px;border-top:2px solid var(--bd);border-bottom:2px solid var(--bd);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{padding:10px 14px;border:2px solid var(--bd);border-bottom-width:4px;border-radius:12px;background:var(--bg);color:var(--fg);font:600 17px inherit;cursor:pointer}.chip.used{opacity:.25;pointer-events:none}
.foot{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--bd);background:var(--bg);display:flex;justify-content:center}
.foot>div{width:100%;max-width:480px}.foot.ok{background:var(--gbg)}.foot.no{background:var(--rbg)}
.fb{font-weight:800;margin-bottom:10px}.foot.ok .fb{color:var(--gd)}.foot.no .fb{color:var(--r)}
.w{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--bd);cursor:pointer}.w b{color:var(--b);font-size:18px}
.big{text-align:center;font-size:64px;margin-top:40px}.sec{text-align:center;color:var(--mu);font-weight:800;margin:24px 0 8px;font-size:13px;letter-spacing:1px;text-transform:uppercase}.nd{display:flex;flex-direction:column;align-items:center;margin:10px 0}.nd small{font-weight:700;margin-top:8px}.bub2{width:76px;height:76px;border-radius:50%;border:0;background:var(--g);box-shadow:0 6px 0 var(--gd);font-size:32px;color:#fff;cursor:pointer}.bub2.dn{background:var(--y);box-shadow:0 6px 0 #d9a900}.bub2.lk{background:var(--bd);box-shadow:0 6px 0 var(--mu);color:var(--mu)}.bub2:active{transform:translateY(4px);box-shadow:none}.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--bg);border-top:2px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}.tabs button{flex:1;max-width:160px;padding:8px;background:none;border:0;font:700 12px inherit;color:var(--mu)}.tabs button.on{color:var(--b)}.tabs i{display:block;font-size:22px;font-style:normal}.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.inp{width:100%;padding:14px;margin-top:10px;border:2px solid var(--bd);border-radius:14px;font:600 20px inherit;background:var(--bg);color:var(--fg)}.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--b);font-size:40px;box-shadow:0 5px 0 #0e8ac4;cursor:pointer;margin:10px 0}.mic.on{background:var(--r);box-shadow:0 5px 0 #c33;animation:pop 1s infinite}.mas{display:flex;gap:10px;align-items:center;margin-top:14px}.mas span{font-size:48px}.bub{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:8px 12px;font-weight:600}.goal{margin:12px 0}.goal small{color:var(--mu);font-weight:600}.btn:active{transform:translateY(3px);box-shadow:none}.opt:active,.chip:active{transform:translateY(2px)}.foot.no{animation:sh .35s}.foot.ok .fb{animation:pop .3s}@keyframes sh{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}@keyframes pop{50%{transform:scale(1.12)}}.cf{position:fixed;top:-40px;z-index:99;pointer-events:none;animation:fall 2.6s ease-in forwards}@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}.c{text-align:center}
.stat{display:inline-block;margin:6px;padding:10px 16px;border:2px solid var(--bd);border-radius:14px;font-weight:800}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}body{margin:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
#app{height:100%;min-height:0!important;padding:0!important;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.sc{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 16px 28px;-webkit-overflow-scrolling:touch}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px}
.foot{position:relative!important;padding-bottom:14px!important}.foot.ok{animation:up .25s}.tabs{position:relative!important;padding-bottom:0!important;flex:none}
@keyframes up{from{transform:translateY(40px);opacity:0}}
input,textarea{-webkit-user-select:text;user-select:text}.inp{font-size:20px}
.mo{position:absolute;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fi .2s}.dg{width:100%;max-width:480px;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 16px 24px}.dg h2{margin:0 0 6px}.dg textarea{width:100%;height:90px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg);font:12px monospace;padding:8px}
@keyframes fi{from{opacity:0}}.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:99}
.bar i{background:linear-gradient(#86e63f,var(--g))}.opt{padding:16px;font-size:18px;border-radius:16px}
.nd{width:fit-content;margin:10px auto;position:relative}.sw{width:52px;height:30px;border-radius:15px;border:0;background:var(--bd);position:relative;flex:none}.sw:after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--g)}.sw.on:after{left:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.grid.g3{grid-template-columns:repeat(3,1fr)}.st{border:2px solid var(--bd);border-radius:14px;padding:10px 6px;text-align:center}.st b{display:block;font-size:19px}.st small,.mu{color:var(--mu);font-weight:600;font-size:12px}.em{font-size:76px;text-align:center;margin:8px 0 0;line-height:1.1}.dc{position:absolute;top:18px;font-size:34px;opacity:.9;pointer-events:none}.chat{display:flex;gap:10px;align-items:flex-end;margin-top:18px}.cav{font-size:36px;width:56px;height:56px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none}.cb{position:relative;background:var(--card);border:2px solid var(--bd);border-radius:18px 18px 18px 4px;padding:10px 14px;font-weight:700;font-size:18px;display:inline-block;max-width:100%}.cb .dots{display:none}.cb.anim .dots{display:inline-flex;gap:4px;position:absolute;left:14px;top:18px;animation:gone 0s .9s forwards}.cb.anim .tx{opacity:0;animation:show .3s .9s forwards}.dots i{width:8px;height:8px;border-radius:50%;background:var(--mu);animation:bl 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes gone{to{opacity:0}}@keyframes show{to{opacity:1}}@keyframes bl{50%{transform:translateY(-5px)}}.chat small{display:block;margin:0 0 4px 4px}</style></head><body><div id="app"></div>
