<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parla – Learn Italian, Spanish &amp; French</title>
<meta name="theme-color" content="#58cc02">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parla">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
:root {
  --bg: #ffffff;
  --fg: #0f172a;
  --mu: #64748b;
  --card: #f8fafc;
  --bd: #e2e8f0;
  --g: #16a34a;
  --gd: #15803d;
  --r: #dc2626;
  --b: #2563eb;
  --y: #d97706;
  --gbg: #dcfce7;
  --rbg: #fee2e2;
  --acc: #16a34a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1220;
    --fg: #f1f5f9;
    --mu: #94a3b8;
    --card: #111c31;
    --bd: #26344d;
    --gbg: #0f3d24;
    --rbg: #4b1d1d;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1220;
  --fg: #f1f5f9;
  --mu: #94a3b8;
  --card: #111c31;
  --bd: #26344d;
  --gbg: #0f3d24;
  --rbg: #4b1d1d;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex;
  justify-content: center;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
input, textarea { -webkit-user-select: text; user-select: text; }
#app {
  width: 100%;
  max-width: 480px;
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
  background: var(--bg);
}
.sc {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0 16px 28px;
  -webkit-overflow-scrolling: touch;
}
.top {
  position: sticky;
  top: 0;
  z-index: 6;
  background: var(--bg);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 700;
  gap: 8px;
  padding: 12px 0 8px;
}
h1 { font-size: 24px; font-weight: 800; letter-spacing: -.02em; margin: 14px 0 4px; }
h2 { font-size: 18px; font-weight: 700; margin: 18px 0 6px; }
p.s { color: var(--mu); margin: 0 0 14px; font-size: 15px; }
.c { text-align: center; }
.ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.2em; flex: none; }
.btn {
  display: block;
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 14px;
  background: var(--g);
  color: #fff;
  font: 700 16px inherit;
  cursor: pointer;
  transition: transform .12s ease, opacity .15s;
}
.btn:active { transform: scale(.97); }
.btn:disabled { background: var(--bd); color: var(--mu); cursor: default; transform: none; }
.btn.red { background: var(--r); }
.btn.blue { background: var(--b); }
.x { background: none; border: 0; font-size: 18px; color: var(--mu); cursor: pointer; font-weight: 600; padding: 4px 6px; }
.bar { flex: 1; height: 13px; background: var(--bd); border-radius: 9px; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, #4ade80, var(--g)); transition: width .35s cubic-bezier(.22,1,.36,1); }
.bar.full i { animation: pulseGlow 1.6s infinite; }
@keyframes pulseGlow { 50% { filter: brightness(1.18); } }

.q { font-size: 22px; font-weight: 800; margin: 12px 0 6px; }
.lab { color: var(--mu); font-weight: 600; font-size: 15px; }
.say {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--card);
  border: 1.5px solid var(--bd);
  border-radius: 14px;
  padding: 10px 16px;
  font: 700 19px inherit;
  color: var(--b);
  margin: 10px 0 14px;
  cursor: pointer;
}
.eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 16px; }
.eq b { width: 3px; height: 6px; background: currentColor; border-radius: 2px; transition: height .15s; }
.say.spk .eq b:nth-child(1) { animation: eq1 .45s infinite; }
.say.spk .eq b:nth-child(2) { animation: eq2 .35s infinite; }
.say.spk .eq b:nth-child(3) { animation: eq3 .4s infinite; }
@keyframes eq1 { 50% { height: 16px; } }
@keyframes eq2 { 50% { height: 14px; } }
@keyframes eq3 { 50% { height: 15px; } }

.opt {
  display: block;
  width: 100%;
  text-align: left;
  padding: 15px;
  margin-bottom: 10px;
  border: 1.5px solid var(--bd);
  border-radius: 14px;
  background: var(--bg);
  color: var(--fg);
  font: 500 17px inherit;
  cursor: pointer;
  transition: transform .1s, border-color .15s, background .15s;
}
.opt:active { transform: scale(.985); }
.opt.sel { border-color: var(--b); background: color-mix(in srgb, var(--b) 10%, var(--bg)); font-weight: 600; }

.ans {
  min-height: 62px;
  border-top: 1.5px solid var(--bd);
  border-bottom: 1.5px solid var(--bd);
  padding: 8px 0;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0 16px;
}
.bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip {
  padding: 10px 14px;
  border: 1.5px solid var(--bd);
  border-radius: 12px;
  background: var(--bg);
  color: var(--fg);
  font: 600 16px inherit;
  cursor: pointer;
  animation: popIn .2s ease;
}
.chip:active { transform: scale(.94); }
.chip.used { opacity: .25; pointer-events: none; }
@keyframes popIn { from { transform: scale(.86); opacity: 0; } }

.foot {
  flex: none;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  border-top: 1.5px solid var(--bd);
  background: var(--bg);
}
.foot.ok { background: var(--gbg); animation: slideUp .22s ease; }
.foot.no { background: var(--rbg); animation: shake .32s ease; }
.fb { font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
.foot.ok .fb { color: var(--gd); }
.foot.no .fb { color: var(--r); }
@keyframes slideUp { from { transform: translateY(26px); opacity: 0; } }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

.tabs {
  flex: none;
  display: flex;
  justify-content: space-around;
  background: var(--bg);
  border-top: 1.5px solid var(--bd);
  padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0px));
}
.tabs button {
  flex: 1;
  background: none;
  border: 0;
  font: 600 11px inherit;
  color: var(--mu);
  padding: 4px 0;
  cursor: pointer;
}
.tabs button.on { color: var(--b); }
.tabs .ic { display: block; margin: 0 auto 2px; }

.w {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 6px;
  border-bottom: 1px solid var(--bd);
  cursor: pointer;
}
.w b { color: var(--b); font-size: 17px; }
.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--bd);
  gap: 10px;
}
.inp {
  width: 100%;
  padding: 13px 14px;
  margin-top: 8px;
  border: 1.5px solid var(--bd);
  border-radius: 14px;
  font: 600 18px inherit;
  background: var(--bg);
  color: var(--fg);
}
.mic {
  position: relative;
  width: 92px;
  height: 92px;
  border-radius: 50%;
  border: 0;
  background: var(--b);
  color: #fff;
  cursor: pointer;
  margin: 10px 0;
  display: inline-grid;
  place-items: center;
}
.mic.on { background: var(--r); }
.mic.on::after {
  content: '';
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  border: 3px solid var(--r);
  animation: ripple 1.2s infinite;
}
@keyframes ripple { 0% { transform: scale(.95); opacity: .9; } 100% { transform: scale(1.38); opacity: 0; } }

.sec {
  text-align: center;
  color: var(--mu);
  font-weight: 800;
  margin: 22px 0 8px;
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.nd {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: fit-content;
  margin: 10px auto;
  position: relative;
  animation: fadeSlide .28s ease backwards;
}
.nd small { font-weight: 700; margin-top: 6px; font-size: 13px; }
.bub2 {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  border: 0;
  background: var(--g);
  color: #fff;
  font: 700 22px inherit;
  box-shadow: 0 3px 10px #0f172a26;
  cursor: pointer;
  display: grid;
  place-items: center;
}
.bub2:active { transform: scale(.94); }
.bub2.dn { background: var(--g); }
.bub2.lk { background: var(--bd); color: var(--mu); box-shadow: none; }
.bub2.qz { background: var(--b); }
.bub2.qz.dn { background: var(--y); }
.bub2.qz.lk { background: var(--bd); }

.card {
  background: var(--card);
  border: 1.5px solid var(--bd);
  border-radius: 16px;
  padding: 14px;
  margin: 10px 0;
}
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
.grid.g3 { grid-template-columns: repeat(3, 1fr); }
.st { border: 1.5px solid var(--bd); background: var(--card); border-radius: 14px; padding: 10px 6px; text-align: center; }
.st b { display: flex; gap: 5px; align-items: center; justify-content: center; font-size: 18px; }
.st small, .mu { color: var(--mu); font-weight: 600; font-size: 12px; }

.lang-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--card);
  border: 1.5px solid var(--bd);
  border-radius: 99px;
  padding: 5px 11px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.pill { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: 15px; }
.avt { display: inline-grid; place-items: center; border-radius: 50%; color: #fff; font-weight: 700; flex: none; }
.sw { width: 50px; height: 28px; border-radius: 14px; border: 0; background: var(--bd); position: relative; flex: none; cursor: pointer; }
.sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: .2s; }
.sw.on { background: var(--g); }
.sw.on::after { left: 25px; }

.mo { position: absolute; inset: 0; background: #0008; display: flex; align-items: flex-end; justify-content: center; z-index: 50; animation: fadeIn .18s; }
.dg { width: 100%; max-width: 480px; background: var(--bg); border-radius: 24px 24px 0 0; padding: 20px 16px 26px; max-height: 85vh; overflow-y: auto; }
.dg h2 { margin: 0 0 6px; }
.dg textarea { width: 100%; height: 84px; border: 1.5px solid var(--bd); border-radius: 12px; background: var(--card); color: var(--fg); font: 12px monospace; padding: 8px; }
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; z-index: 99; animation: fadeSlide .2s; white-space: nowrap; }
.xp-pop { position: fixed; left: 50%; top: 38%; transform: translateX(-50%); background: var(--g); color: #fff; padding: 8px 16px; border-radius: 99px; font-weight: 800; font-size: 18px; z-index: 99; pointer-events: none; animation: floatUp .95s ease-out forwards; }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.9); } 25% { opacity: 1; transform: translate(-50%, 0) scale(1.05); } 100% { opacity: 0; transform: translate(-50%, -44px) scale(1); } }

.cf { width: 9px; height: 13px; border-radius: 2px; position: fixed; top: -40px; z-index: 99; pointer-events: none; animation: fall 2.6s ease-in forwards; }
@keyframes fall { to { transform: translateY(115vh) rotate(540deg); } }
@keyframes fadeSlide { from { opacity: 0; transform: translateY(10px); } }
@keyframes fadeIn { from { opacity: 0; } }
.screen-anim { animation: fadeSlide .22s ease; }

/* Chat UI */
.chat { display: flex; gap: 10px; align-items: flex-end; margin-top: 14px; }
.cav { font: 700 20px inherit; width: 48px; height: 48px; border-radius: 50%; background: var(--card); display: grid; place-items: center; flex: none; }
.cav.sm { width: 32px; height: 32px; font-size: 14px; }
.cb { position: relative; background: var(--card); border: 1.5px solid var(--bd); border-radius: 18px 18px 18px 4px; padding: 10px 14px; font-weight: 700; font-size: 17px; }
.msg { display: flex; gap: 8px; margin: 12px 0; align-items: flex-end; animation: fadeSlide .2s ease; }
.msg.u { justify-content: flex-end; }
.ub { background: var(--b); color: #fff; padding: 10px 14px; border-radius: 16px 16px 4px 16px; max-width: 82%; overflow-wrap: anywhere; }
.mb { background: var(--card); border: 1.5px solid var(--bd); border-radius: 16px 16px 16px 4px; padding: 10px 14px; max-width: 84%; overflow-wrap: anywhere; }
.mu2 { color: var(--mu); font-size: 14px; margin-top: 4px; }
.cor { color: var(--y); font-size: 13px; font-weight: 700; margin-top: 5px; background: color-mix(in srgb, var(--y) 12%, var(--bg)); padding: 4px 8px; border-radius: 8px; }
.cinp { display: flex; gap: 8px; align-items: center; }
.cinp .inp { margin: 0; flex: 1; min-width: 0; }
.send { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--g); color: #fff; flex: none; display: grid; place-items: center; cursor: pointer; }
.send.mic-sm { background: var(--b); }
.send.mic-sm.on { background: var(--r); }

/* Flashcard 3D flip */
.fc-wrap { perspective: 1000px; margin: 18px 0; }
.fc {
  width: 100%;
  min-height: 220px;
  border-radius: 20px;
  border: 2px solid var(--bd);
  background: var(--card);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
  cursor: pointer;
  transition: transform .35s cubic-bezier(.22,1,.36,1), border-color .2s;
}
.fc.flipped { border-color: var(--b); background: color-mix(in srgb, var(--b) 7%, var(--card)); }

/* Streak calendar */
.wk { display: flex; justify-content: space-between; margin: 14px 0; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--mu); font-weight: 600; }
.dot { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--bd); display: grid; place-items: center; color: #fff; }
.dot.on { background: var(--g); border-color: var(--g); }
.dot.fz { background: var(--b); border-color: var(--b); }
.dot.td { border-color: var(--fg); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 10px 0; text-align: center; }
.cal b { font-size: 12px; color: var(--mu); font-weight: 600; }
.cal span { display: grid; place-items: center; aspect-ratio: 1; border-radius: 50%; font-size: 14px; }
.cal .on { background: var(--g); color: #fff; }
.cal .fz { background: var(--b); color: #fff; }
.cal .td { border: 2px solid var(--fg); }
.risk { display: flex; gap: 8px; align-items: center; background: color-mix(in srgb, #ea580c 10%, var(--bg)); border: 1.5px solid #fdba74; color: #c2410c; border-radius: 12px; padding: 10px 12px; margin: 10px 0; font-weight: 600; cursor: pointer; }
.stat { display: inline-block; margin: 5px; padding: 9px 14px; border: 1.5px solid var(--bd); border-radius: 14px; font-weight: 700; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

      { n: 'Directions', g: 'Formal imperative commands use the Lei form: "Vada dritto" (Go straight), "Giri a sinistra" (Turn left).', w: [['dritto','straight'],['all’angolo','at the corner'],['vicino','near'],['lontano','far'],['fermata','stop'],['semaforo','traffic light'],['incrocio','crossroads'],['mappa','map']], s: [['Vada sempre dritto','Go straight ahead'],['La fermata è vicino al ponte','The stop is near the bridge'],['Giri a sinistra al semaforo','Turn left at the traffic light'],['È lontano da qui?','Is it far from here?']] },
      { n: 'Polite & Conditional', g: 'The conditional mood ("potrei", "dovrei", "sarebbe") softens requests and expresses wishes.', w: [['potrei','I could'],['dovrei','I should'],['sarebbe','it would be'],['mi piacerebbe','I would like to'],['per cortesia','please (formal)'],['le dispiace','do you mind'],['mi aiuti','help me (formal)'],['gentilmente','kindly']], s: [['Potrei avere un bicchiere d’acqua?','Could I have a glass of water?'],['Mi piacerebbe vedere il Colosseo','I would like to see the Colosseum'],['Dovrei studiare di più','I should study more'],['Mi può aiutare, per favore?','Can you help me, please?']] },
      { n: 'Hobbies', g: '"Mi piace + infinitive" expresses hobbies: "Mi piace leggere" (I like reading).', w: [['leggere','to read'],['cantare','to sing'],['ballare','to dance'],['nuotare','to swim'],['correre','to run'],['viaggiare','to travel'],['disegnare','to draw'],['giocare','to play']], s: [['Nel tempo libero mi piace leggere','In my free time I like to read'],['Mia sorella canta molto bene','My sister sings very well'],['Vado a nuotare ogni sabato','I go swimming every Saturday'],['Ti piace ballare?','Do you like to dance?']] },
      { n: 'Body & Health', g: '"Mal di + body part" expresses common aches: "mal di testa" (headache), "mal di gola" (sore throat).', w: [['testa','head'],['mano','hand'],['braccio','arm'],['gamba','leg'],['gola','throat'],['stomaco','stomach'],['febbre','fever'],['tosse','cough']], s: [['Ho mal di testa','I have a headache'],['Mi fa male la gola','My throat hurts'],['Ho la febbre da due giorni','I have had a fever for two days'],['Devo andare dal medico','I have to go to the doctor']] },
      { n: 'Market & Cooking', g: '"Un po’ di" (a little bit of) uses an apostrophe because it is shortened from "poco".', w: [['mercato','market'],['verdura','vegetables'],['frutta','fruit'],['uova','eggs'],['olio','oil'],['sale','salt'],['zucchero','sugar'],['ricetta','recipe']], s: [['Al mercato compro frutta e verdura','At the market I buy fruit and vegetables'],['Mi serve un po’ di sale','I need a little salt'],['Questa ricetta è molto facile','This recipe is very easy'],['Vorrei mezzo chilo di pomodori','I would like half a kilo of tomatoes']] },
      { n: 'Future Plans', g: 'The simple future drops the final -e of the infinitive and adds -ò, -ai, -à, -emo, -ete, -anno.', w: [['andrò','I will go'],['mangerò','I will eat'],['farò','I will do'],['sarò','I will be'],['avrò','I will have'],['verrò','I will come'],['partirò','I will leave'],['tra poco','in a bit']], s: [['Domani farò una passeggiata','Tomorrow I will take a walk'],['Il mese prossimo partirò per Napoli','Next month I will leave for Naples'],['Sarò a casa tra poco','I will be home in a bit'],['Verrai alla festa sabato?','Will you come to the party on Saturday?']] },
      { n: 'Technology', g: 'Many tech nouns are borrowed from English ("computer", "password") and are masculine in Italian.', w: [['computer','computer'],['schermo','screen'],['rete','network'],['password','password'],['scaricare','to download'],['condividere','to share'],['collegarsi','to connect'],['applicazione','app']], s: [['Il mio computer è troppo lento','My computer is too slow'],['Puoi condividere il file con me?','Can you share the file with me?'],['Non riesco a collegarmi a internet','I cannot connect to the internet'],['Ho dimenticato la password','I forgot the password']] },
      { n: 'Love & Friends', g: 'With "mancare" (to miss), the person missed is the subject: "Mi manchi" literally means "You are missing to me."', w: [['amore','love'],['fidanzato','boyfriend'],['matrimonio','wedding'],['litigare','to argue'],['fidarsi','to trust'],['mancare','to miss'],['sorridere','to smile'],['abbracciare','to hug']], s: [['Mi manchi molto','I miss you a lot'],['Non mi fido di lui','I do not trust him'],['Ci siamo conosciuti all’università','We met at university'],['Mia sorella si sposa a giugno','My sister is getting married in June']] },
      { n: 'News & Society', g: 'Nouns ending in -zione ("inquinamento" vs "elezioni") are always feminine.', w: [['ambiente','environment'],['inquinamento','pollution'],['governo','government'],['notizia','news item'],['elezioni','elections'],['sciopero','strike'],['incidente','accident'],['crisi','crisis']], s: [['Hai letto la notizia di oggi?','Did you read today’s news?'],['Il governo ha annunciato nuove misure','The government announced new measures'],['L’inquinamento è un grande problema','Pollution is a big problem'],['Domani c’è lo sciopero dei treni','Tomorrow there is a train strike']] },
      { n: 'Idioms', g: 'Traditional reply to "In bocca al lupo!" (Good luck!) is "Crepi il lupo!" or simply "Grazie!"', w: [['in bocca al lupo','good luck'],['piove a dirotto','it is pouring'],['non vedo l’ora','I can’t wait'],['che peccato','what a shame'],['meno male','thank goodness'],['a presto','see you soon'],['per fortuna','luckily'],['capito','got it']], s: [['Non vedo l’ora di partire','I cannot wait to leave'],['Meno male che sei arrivato','Thank goodness you arrived'],['Questa borsa costa un occhio della testa','This bag costs a fortune'],['In bocca al lupo per l’esame','Good luck with the exam']] },
      { n: 'Subjunctive', g: 'Expressions of hope, belief, or necessity ("spero che", "credo che", "è importante che") trigger the subjunctive mood.', w: [['spero che','I hope that'],['credo che','I believe that'],['è importante che','it is important that'],['sebbene','although'],['affinché','so that'],['prima che','before'],['può darsi che','it may be that'],['nonostante','despite']], s: [['Spero che tu stia bene','I hope you are well'],['Credo che sia già partito','I think he has already left'],['È importante che tu studi','It is important that you study'],['Sebbene piova, esco lo stesso','Although it is raining, I am going out anyway']] },
      { n: 'Formal & Business', g: 'Formal emails open with "Gentile Signora / Egregio Signore" and close with "Cordiali saluti".', w: [['gentile signora','dear madam'],['cordiali saluti','kind regards'],['allegato','attached'],['scadenza','deadline'],['contratto','contract'],['fattura','invoice'],['appuntamento','appointment'],['preventivo','quote']], s: [['Le invio il contratto in allegato','I am sending you the contract attached'],['La scadenza è venerdì prossimo','The deadline is next Friday'],['Vorrei fissare un appuntamento','I would like to schedule an appointment'],['Resto in attesa di una sua risposta','I look forward to your reply']] }
    ]

      { n: 'Everyday', g: 'Spanish infinitives end in -ar, -er, or -ir. Subject pronouns ("yo", "tú") are optional because verb endings show the subject.', w: [['comer','to eat'],['beber','to drink'],['hablar','to speak'],['entender','to understand'],['querer','to want'],['ir','to go'],['casa','house'],['hoy','today']], s: [['No entiendo','I do not understand'],['Hablo un poco de español','I speak a little Spanish'],['¿Adónde vas hoy?','Where are you going today?']] },
      { n: 'Ser & Estar', g: 'Spanish has two verbs for "to be": "ser" (soy, eres, es) for identity/origin, and "estar" (estoy, estás, está) for feelings and location.', w: [['soy','I am (perm.)'],['estoy','I am (state)'],['es','he/she is'],['somos','we are'],['tengo','I have'],['tienes','you have'],['tiene','he/she has'],['tenemos','we have']], s: [['Yo soy español','I am Spanish'],['Tú tienes un perro','You have a dog'],['Estamos cansados','We are tired'],['Ella tiene dos gatos','She has two cats']] },
      { n: 'Colours & Adjectives', g: 'Adjectives follow the noun and match gender/number: "un coche rojo" (masculine) vs. "una casa roja" (feminine).', w: [['rojo','red'],['azul','blue'],['verde','green'],['negro','black'],['blanco','white'],['grande','big'],['pequeño','small'],['bonito','beautiful']], s: [['La casa es grande','The house is big'],['El gato es negro','The cat is black'],['Qué día tan bonito','What a beautiful day'],['Tengo un coche rojo','I have a red car']] },
      { n: 'Days & Time', g: 'Days of the week are masculine and lowercase in Spanish. Use "el" for "on": "el sábado" (on Saturday).', w: [['lunes','Monday'],['viernes','Friday'],['sábado','Saturday'],['domingo','Sunday'],['ayer','yesterday'],['mañana','tomorrow'],['mañana (parte)','morning'],['noche','evening']], s: [['Mañana es sábado','Tomorrow is Saturday'],['¿Qué hora es?','What time is it?'],['Trabajo de lunes a viernes','I work Monday to Friday'],['Anoche comí pizza','Last night I ate pizza']] },
      { n: 'Restaurant', g: '"Quisiera" or "Me gustaría" (I would like) sounds polite when ordering at a restaurant.', w: [['menú','menu'],['camarero','waiter'],['mesa','table'],['entrante','starter'],['postre','dessert'],['cerveza','beer'],['carne','meat'],['pescado','fish']], s: [['Una mesa para dos, por favor','A table for two, please'],['¿Qué recomienda?','What do you recommend?'],['Soy vegetariano','I am vegetarian'],['¿Me trae el menú?','Can you bring me the menu?']] },
      { n: 'Questions', g: 'All interrogative words ("qué", "dónde", "cuándo", "cómo", "quién") carry a written accent mark.', w: [['quién','who'],['qué','what'],['dónde','where'],['cuándo','when'],['por qué','why'],['cómo','how'],['cuánto','how much'],['cuál','which']], s: [['¿Dónde vives?','Where do you live?'],['¿Cuánto cuesta?','How much does it cost?'],['¿Por qué estudias español?','Why do you study Spanish?'],['¿Cuándo llega el tren?','When does the train arrive?']] },
      { n: 'Present: -ar verbs', g: 'Regular -ar verbs drop -ar and add -o, -as, -a, -amos, -áis, -an in the present tense.', w: [['hablo','I speak'],['como','I eat'],['trabajo','I work'],['vivo','I live'],['estudio','I study'],['amo','I love'],['busco','I look for'],['compro','I buy']], s: [['Vivo en Londres','I live in London'],['Trabajo en una oficina','I work in an office'],['Estudio español cada día','I study Spanish every day'],['Compro el pan en el mercado','I buy bread at the market']] },
      { n: 'Shopping', g: '"Este/esta" means "this" ("esta bolsa", "este vestido"). Remember: "esta" without an accent means "this", "está" with an accent means "is".', w: [['tienda','shop'],['precio','price'],['dinero','money'],['tarjeta','card'],['bolsa','bag'],['zapatos','shoes'],['vestido','dress'],['talla','size']], s: [['¿Cuánto cuesta esta bolsa?','How much is this bag?'],['¿Puedo pagar con tarjeta?','Can I pay by card?'],['Busco un vestido azul','I am looking for a blue dress'],['Es demasiado caro','It is too expensive']] },
      { n: 'Past Tense (Preterite)', g: 'The preterite tense describes completed past actions: "comí" (I ate), "bebí" (I drank), "fui" (I went/was).', w: [['comí','I ate'],['bebí','I drank'],['vi','I saw'],['hablé','I spoke'],['fui','I went'],['estuve','I was'],['entendí','I understood'],['compré','I bought']], s: [['Ayer fui al mercado','Yesterday I went to the market'],['Vi una película','I saw a film'],['Comimos juntos','We ate together'],['¿Dónde estuviste?','Where were you?']] },
      { n: 'Feelings & Health', g: 'Spanish uses "tener" (to have) for hunger, thirst, and being sleepy: "Tengo hambre y sed".', w: [['feliz','happy'],['triste','sad'],['cansado','tired'],['hambre','hunger'],['sed','thirst'],['dolor','pain'],['médico','doctor'],['farmacia','pharmacy']], s: [['Estoy muy cansado','I am very tired'],['Tengo hambre y sed','I am hungry and thirsty'],['Me duele la cabeza','My head hurts'],['¿Dónde está la farmacia?','Where is the pharmacy?']] },
      { n: 'Wants & Future', g: 'Use "ir a + infinitive" for near future plans: "Voy a viajar" (I am going to travel).', w: [['quiero','I want'],['puedo','I can'],['debo','I must'],['quisiera','I would like'],['pronto','soon'],['tarde','late'],['siempre','always'],['nunca','never']], s: [['Quiero aprender español','I want to learn Spanish'],['Debo ir al trabajo','I have to go to work'],['Mañana iré a Madrid','Tomorrow I will go to Madrid'],['Nunca he estado en Sevilla','I have never been to Seville']] },
      { n: 'Conversation', g: '"Me gusta" means "it pleases me" (singular); use "Me gustan" when talking about plural things.', w: [['mucho gusto','nice to meet you'],['me gusta','I like'],['no lo sé','I don’t know'],['quizás','maybe'],['claro','of course'],['de verdad','really'],['lo siento','I’m sorry'],['con gusto','gladly']], s: [['Me gusta mucho la música','I like music a lot'],['¿Puedes hablar más despacio?','Can you speak more slowly?'],['¿Cómo se dice en español?','How do you say it in Spanish?'],['Me gustaría viajar a España','I would like to travel to Spain']] },
      { n: 'Daily Routine', g: 'Reflexive verbs use "me" for "I": "me despierto" (I wake up), "me levanto" (I get up).', w: [['me despierto','I wake up'],['me levanto','I get up'],['me lavo','I wash'],['desayuno','I have breakfast'],['salgo de casa','I leave home'],['vuelvo a casa','I come back home'],['cocino','I cook'],['me acuesto','I go to bed']], s: [['Me despierto a las siete','I wake up at seven'],['Desayuno en la cafetería','I have breakfast at the café'],['Por la noche cocino para la familia','In the evening I cook for the family'],['Normalmente me acuesto tarde','I usually go to bed late']] },
      { n: 'Work & Study', g: '"a + el" contracts to "al" ("al trabajo"), and "de + el" contracts to "del".', w: [['trabajo','job'],['oficina','office'],['reunión','meeting'],['colega','colleague'],['jefe','boss'],['sueldo','salary'],['escuela','school'],['universidad','university']], s: [['¿En qué trabajas?','What do you do for a living?'],['Mi colega trabaja mucho','My colleague works a lot'],['Mañana tengo una reunión importante','Tomorrow I have an important meeting'],['Estudio en la universidad','I study at the university']] },
      { n: 'Home & City', g: '"Hay" means both "there is" and "there are" in Spanish—it never changes form.', w: [['cocina','kitchen'],['habitación','bedroom'],['baño','bathroom'],['jardín','garden'],['ciudad','city'],['plaza','square'],['puente','bridge'],['iglesia','church']], s: [['¿Dónde está el baño?','Where is the bathroom?'],['Vivo en el centro cerca de la plaza','I live downtown near the square'],['Hay un jardín detrás de la casa','There is a garden behind the house'],['Mi habitación está en el primer piso','My bedroom is on the first floor']] },
      { n: 'Weather & Seasons', g: 'Spanish uses "hace" for most weather descriptions ("Hace calor" – It’s hot, "Hace frío" – It’s cold).', w: [['sol','sun'],['lluvia','rain'],['nieve','snow'],['viento','wind'],['calor','hot'],['frío','cold'],['verano','summer'],['invierno','winter']], s: [['Hoy hace mucho calor','Today it is very hot'],['En invierno nieva a menudo','In winter it often snows'],['Mañana lloverá todo el día','Tomorrow it will rain all day'],['¿Qué tiempo hace?','What is the weather like?']] },
      { n: 'Imperfect Past', g: 'The imperfect tense (-aba / -ía) describes childhood habits and ongoing past states ("De niño jugaba...").', w: [['era','I was'],['tenía','I had'],['iba','I used to go'],['jugaba','I used to play'],['vivía','I used to live'],['sabía','I knew'],['quería','I wanted'],['cocinaba','she used to cook']], s: [['De niño jugaba siempre fuera','As a child I always played outside'],['Vivía en Madrid cuando era joven','I lived in Madrid when I was young'],['Mi abuela cocinaba cada domingo','My grandmother cooked every Sunday'],['No sabía la respuesta','I did not know the answer']] },
      { n: 'Opinions', g: 'After "Creo que" or "Pienso que" (positive statements), Spanish uses the normal indicative mood.', w: [['pienso que','I think that'],['en mi opinión','in my opinion'],['pero','but'],['así que','therefore'],['también','also'],['en cambio','instead'],['como','since'],['además','moreover']], s: [['En mi opinión es una buena idea','In my opinion it is a good idea'],['Pienso que es demasiado difícil','I think it is too difficult'],['Estoy cansado, así que voy a casa','I am tired, so I am going home'],['Me gusta el café, pero prefiero el té','I like coffee, but I prefer tea']] },

const AC = window.AudioContext || window.webkitAudioContext;
let ac;
const tone = (f, d, t = 0) => {
  if (!S.snd || !AC) return;
  try {
    ac = ac || new AC();
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = f;
    o.type = 'triangle';
    g.gain.setValueAtTime(.14, ac.currentTime + t);
    g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + t + d);
    o.connect(g);
    g.connect(ac.destination);
    o.start(ac.currentTime + t);
    o.stop(ac.currentTime + t + d);
  } catch (e) {}
};
const sfx = {

let VOICES = [];
const refreshVoices = () => {
  try { VOICES = speechSynthesis.getVoices() || []; } catch (e) { VOICES = []; }
};
try { speechSynthesis.onvoiceschanged = refreshVoices; refreshVoices(); } catch (e) {}

function resolveVoiceSlot(langCode, slotId) {
  refreshVoices();
  const cfg = LANGS[langCode];
  const preset = cfg.voices.find(v => v.id === slotId) || cfg.voices[0];
  const prefix = langCode.toLowerCase();
  const matching = VOICES.filter(v => (v.lang || '').toLowerCase().startsWith(prefix));
  const score = v => (
    (/premium|enhanced|natural|neural|google|siri/i.test(v.name) ? 4 : 0) +
    (preset.gender === 'm' && /luca|jorge|carlos|diego|thomas|nicolas|henri|male/i.test(v.name) ? 3 : 0) +
    (preset.gender === 'f' && /alice|federica|elsa|paola|monica|paulina|amelie|audrey|aurelie|female/i.test(v.name) ? 3 : 0) +
    (/compact|espeak|eloquence/i.test(v.name) ? -4 : 0)
  );
  matching.sort((a, b) => score(b) - score(a));
  const idx = slotId === 'v1' ? 0 : slotId === 'v2' ? 1 : 2;
  const deviceVoice = matching[idx] || matching[0] || null;
  return { preset, deviceVoice, count: matching.length };
}

function say(text, slow = false, overrideSlot = null) {
  if (!text) return;
  try {
    speechSynthesis.cancel();
    const slot = overrideSlot || LS().vo || 'v1';
    const { preset, deviceVoice } = resolveVoiceSlot(S.lang, slot);
    const u = new SpeechSynthesisUtterance(text);
    u.lang = curL().locale;
    if (deviceVoice) u.voice = deviceVoice;
    u.pitch = preset.pitch;
    const baseRate = S.spd || preset.rate || 0.9;
    u.rate = slow ? Math.max(0.55, baseRate * 0.68) : baseRate;
    u.onstart = () => document.querySelectorAll('.say').forEach(b => b.classList.add('spk'));
    u.onend = u.onerror = () => document.querySelectorAll('.say').forEach(b => b.classList.remove('spk'));
    speechSynthesis.speak(u);
  } catch (e) {}
}

const lvl = () => Math.floor(S.xp / 100);

const lev = (a, b) => {
  const d = [...Array(b.length + 1).keys()];
  for (let i = 1; i <= a.length; i++) {
    let p = d[0];
    d[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const t = d[j];
      d[j] = Math.min(d[j] + 1, d[j - 1] + 1, p + (a[i - 1] === b[j - 1] ? 0 : 1));
      p = t;
    }
  }
  return d[b.length];
};
const nm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();

  const x = nm(h).split(' '), y = nm(a).split(' ');
  if (lev(x.join(''), y.join('')) <= Math.floor(y.join('').length * .18)) return 1;
  return y.filter(w => x.some(v => v === w || (w.length > 4 && lev(v, w) < 2))).length / Math.max(y.length, 1);
};

/* ================= LESSON GENERATOR & ENGINE ================= */
function mk(i) {
  const u = U()[i], q = [], lg = curL();
  sh(u.w).slice(0, 7).forEach((w, k) => {
    const d = x => sh(u.w.filter(y => y[x] !== w[x])).slice(0, 3).map(y => y[x]);
    if (k % 3 === 0) q.push({ t: 'm', lab: 'Translate to English', p: w[0], a: w[1], o: sh([w[1], ...d(1)]), say: w[0] });
    else if (k % 3 === 1) q.push(k === 4
      ? { t: 's', lab: 'Say this word out loud', p: w[1], a: w[0], say: w[0] }
      : { t: 't', lab: `Write this in ${lg.name}`, p: w[1], a: w[0], say: w[0] });
    else q.push({ t: 'm', lab: 'Tap what you hear', p: '', a: w[1], o: sh([w[1], ...d(1)]), say: w[0], auto: 1 });
  });
  u.s.forEach(([tl, en]) => {
    const a = tl.split(' ');
    const ex = sh(u.s.filter(s => s[0] !== tl).flatMap(s => s[0].split(' ')).filter(x => !a.includes(x))).slice(0, 2);
    q.push({ t: 'b', lab: `Write this in ${lg.name}`, p: en, a, o: sh([...a, ...ex]), say: tl });
  });
  u.s.slice(0, 1).forEach(([tl, en]) => {
    const a = en.split(' ');
    const ex = sh(u.s.filter(s => s[1] !== en).flatMap(s => s[1].split(' ')).filter(x => !a.includes(x))).slice(0, 2);
    q.push({ t: 'b', rev: 1, lab: 'Translate to English', p: tl, a, o: sh([...a, ...ex]), say: tl });
  });
  const s0 = u.s[0], s1 = u.s[1], s2 = u.s[2];
  q.push(
    { t: 't', lab: `Write this in ${lg.name}`, p: s0[1], a: s0[0], say: s0[0] },
    { t: 't', lab: 'Type what you hear', p: 'Listen carefully', a: s2[0], say: s2[0], auto: 1 },
    { t: 's', lab: 'Say this sentence out loud', p: s1[1], a: s1[0], say: s1[0] }
  );
  const out = sh(q);
  if (Math.random() < .7) {
    const z = sh(u.s);
    const tu = lg.tutor;
    out.splice(3, 0, {
      t: 'm',
      chat: [tu.init, tu.name, tu.color],
      auto: 1,
      lab: 'New message',
      p: z[0][0],
      a: z[0][1],
      o: sh(z.slice(0, 4).map(x => x[1])),
      say: z[0][0]
    });
  }
  return out;
}

function mkW() {
  const ks = Object.keys(LS().wrong).sort((a, b) => LS().wrong[b] - LS().wrong[a]).slice(0, 8);
  const A = allWords(), q = [];
  ks.forEach((k, j) => {
    const w = A.find(x => x[0] === k);
    if (!w) return;
    const t = j % 2, idx = t ? 0 : 1;
    const d = sh(A.filter(y => y[idx] !== w[idx])).slice(0, 3).map(y => y[idx]);
    q.push({ t: 'm', lab: t ? `Translate to ${curL().name}` : 'Translate to English', p: w[t ? 1 : 0], a: w[idx], o: sh([w[idx], ...d]), say: w[0] });
  });
  return q;
}

function start(t = 0) {
  const q = I < 0 ? mkW() : mk(I);
  const filtered = t ? q.filter(c => c.t === 'm' || c.t === 't').slice(0, 6) : q;
  if (!filtered.length) { scr = 'home'; r(); return; }
  L = { q: filtered, n: filtered.length, ok: 0, h: t ? 2 : 999, sel: null, res: null, test: t, cb: 0 };
  scr = 'lesson';
  r();
  if (filtered[0].auto) say(filtered[0].say);
}

function mkQ(ix, n) {
  const W = ix.flatMap(i => U()[i].w), Sn = ix.flatMap(i => U()[i].s), q = [];
  const d = (w, k) => sh(W.filter(y => y[k] !== w[k])).slice(0, 3).map(y => y[k]);
  sh(W).slice(0, Math.ceil(n * .65)).forEach((w, k) => {
    const t = k % 4;
    q.push(
      t === 0 ? { t: 'm', lab: 'Translate to English', p: w[0], a: w[1], o: sh([w[1], ...d(w, 1)]), say: w[0] } :
      t === 1 ? { t: 'm', lab: `Translate to ${curL().name}`, p: w[1], a: w[0], o: sh([w[0], ...d(w, 0)]), say: w[0] } :
      t === 2 ? { t: 'm', lab: 'Tap what you hear', p: '', a: w[1], o: sh([w[1], ...d(w, 1)]), say: w[0], auto: 1 } :
      { t: 't', lab: `Write this in ${curL().name}`, p: w[1], a: w[0], say: w[0] }
    );
  });
  sh(Sn).slice(0, Math.max(0, n - q.length)).forEach(([tl, en], k) => {
    const rv = k % 2, a = (rv ? en : tl).split(' ');
    const pl = sh(Sn.filter(s => s[rv ? 1 : 0] !== (rv ? en : tl)).flatMap(s => s[rv ? 1 : 0].split(' ')).filter(x => !a.includes(x))).slice(0, 2);
    q.push({ t: 'b', rev: rv, lab: rv ? 'Translate to English' : `Write this in ${curL().name}`, p: rv ? tl : en, a, o: sh([...a, ...pl]), say: tl });
  });
  return sh(q);
}

function startQ(kind, ix, n, ch = 0) {
  I = -2;
  const q = mkQ(ix, n);
  if (!q.length) { toast('Complete a unit first'); return; }
  L = { q, n: q.length, ok: 0, h: 999, sel: null, res: null, kind, ch, first: 0, cb: 0 };

}

const cur = () => L.q[0];
function pick(k) {
  const c = cur();
  if (L.res) return;
  if (c.t === 'm') L.sel = k;
  else { L.sel = L.sel || []; L.sel.push(k); }
  try { navigator.vibrate && navigator.vibrate(10); } catch (e) {}
  r();
}
function unpick(j) { if (!L.res) { L.sel.splice(j, 1); r(); } }
function ins(ch) { const i = $('#inp'); if (!i || L.res) return; i.value += ch; L.sel = i.value; i.focus(); }
function sOk() { L.sel = '__ok'; r(); }
function skipEx() { L.q.shift(); L.n--; L.sel = null; L.res = null; if (L.q.length) r(); else finish(); }

function listen() {
  const R = window.SpeechRecognition || window.webkitSpeechRecognition, c = cur();
  if (L.res) return;
  if (!R) { L.nomic = 1; L.msg = 'Speech recognition isn’t supported in this browser.'; r(); return; }
  try {
    const x = new R();
    x.lang = curL().locale;
    x.maxAlternatives = 3;
    x.interimResults = true;
    L.live = 1; L.msg = ''; L.sel = null; r();
    x.onresult = e => {
      const rs = e.results[e.results.length - 1], al = [...rs].map(a => a.transcript);
      if (rs.isFinal) {
        L.sel = al.sort((p, q) => sc(q, c.a) - sc(p, c.a))[0];
        L.live = 0; r();
      } else {
        const el = $('#heard');
        if (el) el.textContent = '“' + al[0] + '”';
      }
    };
    x.onerror = e => { L.live = 0; L.msg = 'Mic error: ' + e.error; L.nomic = 1; r(); };
    x.onend = () => { if (L.live) { L.live = 0; L.msg = 'Didn’t catch that. Tap mic to retry.'; r(); } };
    x.start();
  } catch (e) { L.live = 0; L.nomic = 1; L.msg = 'Couldn’t start microphone.'; r(); }
}

function check() {
  const c = cur();
  if (L.res) return;
  if (c.t === 't' && !(L.sel || '').trim()) return;
  let ok = false, accentHint = '';
  if (c.t === 'm') ok = c.o[L.sel] === c.a;
  else if (c.t === 't') {
    ok = np(L.sel) === np(c.a);
    if (ok && L.sel.trim().toLowerCase() !== c.a.trim().toLowerCase()) accentHint = c.a;
  } else if (c.t === 's') ok = L.sel === '__ok' || sc(L.sel, c.a) >= .68;
  else {
    const j = L.sel.map(k => c.o[k]).join(' ');
    ok = j === c.a.join(' ') || np(j) === np(c.a.join(' '));
  }

  L.res = ok ? 'ok' : 'no';
  L.accentHint = accentHint;
  try { navigator.vibrate && navigator.vibrate(ok ? 15 : [50, 35, 50]); } catch (e) {}
  if (!ok) {
    c.rt = 1; L.h--; L.cb = 0; L.err = 1; sfx.no();
    if (allWords().some(w => w[0] === c.say)) LS().wrong[c.say] = (LS().wrong[c.say] || 0) + 1;
  } else {
    L.ok++;
    if (!c.rt) L.first = (L.first || 0) + 1;
    L.cb = (L.cb || 0) + 1;
    sfx.ok();
    xpPop(L.cb >= 3 ? `Combo x${L.cb}! 🔥` : '+XP ✨');
    if (LS().wrong[c.say]) {
      LS().wrong[c.say]--;
      if (LS().wrong[c.say] < 1) delete LS().wrong[c.say];
    }
  }
  if (c.t === 'b' || ok) say(c.say);
  r();
}

function next() {
  const c = L.q.shift();
  if (L.res === 'no' && L.h > 0) L.q.push(c);
  L.sel = null; L.res = null; L.accentHint = '';
  if (L.h <= 0) scr = 'fail';
  else if (!L.q.length) { finish(); return; }
  r();
  if (cur() && cur().auto) say(cur().say);
}

function finish() {
  if (L.kind) { finishQ(); return; }
  const t = today();
  bump();
  const g = L.test ? 5 : 10 + (L.err ? 0 : 5);
  L.gain = g; S.xp += g; S.log[t] = (S.log[t] || 0) + g;
  if (I >= 0) {
    LS().done[I] = (LS().done[I] || 0) + 1;
    if (L.test) for (let j = 0; j < I; j++) LS().done[j] = LS().done[j] || 1;
  }
  S.les++;
  if (!L.err) S.perf++;
  L.new = AD.filter(a => !S.ach[a[1]] && a[2]()).map(a => (S.ach[a[1]] = 1, a[1]));
  sfx.win();
  scr = 'end';
  r();
  boom();
}

function finishQ() {
  const t = today(), pct = Math.round((L.first || 0) / Math.max(L.n, 1) * 100), k = L.kind, pass = pct >= 80;
  bump();
  const xp = k === 'daily' ? 10 : k === 'quiz' ? (pass ? 40 : 10) : 5;
  S.xp += xp; S.log[t] = (S.log[t] || 0) + xp;
  if (k === 'daily') { S.dq = t; S.dqn = (S.dqn || 0) + 1; }
  if (k === 'quiz') { LS().quiz = LS().quiz || {}; LS().quiz[L.ch] = Math.max(LS().quiz[L.ch] || 0, pct); }
  L.out = { k, pct, pass, xp, new: AD.filter(a => !S.ach[a[1]] && a[2]()).map(a => (S.ach[a[1]] = 1, a[1])) };
  sfx.win();
  scr = 'qres';
  r();
  if (k !== 'quiz' || pass) boom();
}

/* ================= ARCADE: 60s LIGHTNING ROUND ================= */
function startBlitz() {
  const ix = Object.keys(LS().done).map(Number);
  const pool = (ix.length ? ix : [0, 1]).flatMap(i => U()[i].w);
  const nextCard = () => {
    const w = pool[Math.floor(Math.random() * pool.length)];
    const dir = Math.random() < .5 ? 0 : 1;
    const dist = sh(pool.filter(x => x[1 - dir] !== w[1 - dir])).slice(0, 3).map(x => x[1 - dir]);
    return { p: w[dir], a: w[1 - dir], say: w[0], opts: sh([w[1 - dir], ...dist]) };
  };
  BLITZ = { score: 0, combo: 0, left: 60, card: nextCard(), nextCard };
  scr = 'blitz';
  r();
  clearInterval(window._bt);
  window._bt = setInterval(() => {
    if (scr !== 'blitz' || !BLITZ) { clearInterval(window._bt); return; }
    BLITZ.left--;
    const tb = $('#btime'), bb = $('#bbar');
    if (tb) tb.textContent = BLITZ.left + 's';
    if (bb) bb.style.width = Math.max(0, BLITZ.left / 60 * 100) + '%';
    if (BLITZ.left <= 0) {
      clearInterval(window._bt);
      const gain = Math.min(25, Math.max(5, Math.floor(BLITZ.score / 2)));
      S.xp += gain;
      S.log[today()] = (S.log[today()] || 0) + gain;
      LS().blitzBest = Math.max(LS().blitzBest || 0, BLITZ.score);
      bump();
      sfx.win();
      boom();
      dlg('⚡ Lightning Round Over!',
        `<div class='c'>${mascot('cheer', 100)}<h1>${BLITZ.score} pts</h1><p class='s'>Best in ${curL().name}: <b>${LS().blitzBest} pts</b> · +${gain} XP earned!</p></div>`,
        `<button class='btn' onclick="M=null;scr='home';r()">Back to Review</button>`
      );
    }
  }, 1000);
}

function ansBlitz(opt) {
  if (!BLITZ) return;
  const ok = opt === BLITZ.card.a;
  if (ok) {
    BLITZ.combo++;
    const mult = BLITZ.combo >= 5 ? 3 : BLITZ.combo >= 3 ? 2 : 1;
    BLITZ.score += 10 * mult;
    sfx.ok();
    say(BLITZ.card.say);
  } else {
    BLITZ.combo = 0;
    sfx.no();
  }
  BLITZ.card = BLITZ.nextCard();
  r();
}

/* ================= TUTOR (FIXED & UPGRADED FOR ALL 3 LANGUAGES) ================= */
let AI = null, BUSY = 0;

function botLocal(userText) {
  const lg = curL();
  const code = S.lang;
  const P = LS().cp;
  const clean = nm(userText);
  const out = [];

  if (P) {
    const matched = np(userText) === np(P.tl) || sc(userText, P.tl) >= 0.78;
    if (matched) {
      out.push(code === 'es' ? '¡Muy bien! Así se dice.' : code === 'fr' ? 'Très bien ! C’est exactement ça.' : 'Ottimo! Hai risposto benissimo.');
    } else {
      out.push(code === 'es' ? `Casi. Se dice: "${P.tl}"` : code === 'fr' ? `Presque ! On dit : « ${P.tl} »` : `Quasi! Si dice: "${P.tl}"`);
    }
  }

  if (/^(ciao|salve|buongiorno|buonasera|hola|buenos dias|buenas tardes|bonjour|salut|bonsoir)/.test(clean)) {
    out.push(
      code === 'es' ? `¡Hola ${S.name}! ¿Cómo estás hoy?` :
      code === 'fr' ? `Bonjour ${S.name} ! Comment ça va aujourd’hui ?` :
      `Ciao ${S.name}! Come stai oggi?`
    );
  } else if (/come stai|come va|como estas|que tal|comment ca va|ca va/.test(clean)) {
    out.push(
      code === 'es' ? '¡Estoy muy bien, gracias por preguntar!' :
      code === 'fr' ? 'Je vais très bien, merci beaucoup !' :
      'Sto benissimo, grazie mille!'
    );
  } else if (/mi chiamo|me llamo|je m appelle/.test(clean)) {
    out.push(
      code === 'es' ? `¡Mucho gusto, ${S.name}!` :
      code === 'fr' ? `Enchantée, ${S.name} !` :
      `Piacere di conoscerti, ${S.name}!`
    );
  } else if (/vorrei|quisiera|quiero|je voudrais|j aimerais/.test(clean)) {
    out.push(
      code === 'es' ? '¡Con mucho gusto! Aquí tienes.' :
      code === 'fr' ? 'Avec plaisir ! Voilà pour toi.' :
      'Volentieri! Ecco a te.'
    );
  } else if (/grazie|gracias|merci/.test(clean)) {
    out.push(
      code === 'es' ? '¡De nada!' :
      code === 'fr' ? 'De rien !' :
      'Prego!'
    );
  }

  let fix = '';
  if (code === 'it' && /\bperche\b/i.test(userText)) fix = 'Correzione: "perché" needs an acute accent on the final é.';
  else if (code === 'it' && /\bcaffe\b/i.test(userText)) fix = 'Correzione: "caffè" takes a grave accent on the final è.';
  else if (code === 'it' && /\bsi\b/i.test(userText) && !/\bsì\b/i.test(userText)) fix = 'Correzione: "sì" (yes) has a grave accent to distinguish it from "si".';
  if (code === 'es' && /\bespanol\b/i.test(userText)) fix = 'Corrección: Remember the tilde in "español" (ñ).';
  else if (code === 'es' && /\bcafe\b/i.test(userText)) fix = 'Corrección: "café" takes an acute accent on the é.';
  else if (code === 'es' && /\bcomo estas\b/i.test(userText)) fix = 'Corrección: Write "¿Cómo estás?" with accents and opening question mark.';
  if (code === 'fr' && /\bca va\b/i.test(userText)) fix = 'Correction : Use a cedilla in « ça va » (ç).';
  else if (code === 'fr' && /\bcafe\b/i.test(userText)) fix = 'Correction : « café » takes an acute accent (é).';
  else if (code === 'fr' && /\btres\b/i.test(userText)) fix = 'Correction : « très » takes a grave accent (è).';

  const ix = Object.keys(LS().done).map(Number);
  const pool = (ix.length ? ix : [0]).flatMap(i => U()[i].s);
  const nxt = pool[Math.floor(Math.random() * pool.length)];
  LS().cp = { tl: nxt[0], en: nxt[1] };

  const ask = code === 'es'
    ? `¿Cómo dices "${nxt[1]}" en español?`
    : code === 'fr'
    ? `Comment dit-on « ${nxt[1]} » en français ?`
    : `Come si dice "${nxt[1]}" in italiano?`;

  const line1 = (out.length ? out.join(' ') + ' ' : '') + ask;
  const line2 = `EN: Translate "${nxt[1]}" into ${lg.name}.`;
  return [line1, line2, fix].filter(Boolean).join('
');
}

function sayMsg(i, slow = false) {
  const msg = LS().chat[i];

  const line1 = msg.t.split('

}

function chatMic() {
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!R) { toast('Voice input not supported in this browser'); return; }
  try {
    const x = new R();
    x.lang = curL().locale;
    window._cmic = 1; r();
    x.onresult = e => {
      window._cmic = 0;
      const txt = e.results[0][0].transcript;
      sendChat(txt);
    };
    x.onerror = x.onend = () => { window._cmic = 0; r(); };
    x.start();
  } catch (e) { window._cmic = 0; r(); }
}

async function sendChat(t) {
  t = (typeof t === 'string' ? t : ($('#ci') || {}).value || '').trim();
  if (!t || BUSY) return;
  LS().chat.push({ r: 'u', t });
  BUSY = 1;
  r();
  if (!AI) {
    setTimeout(() => {
      LS().chat.push({ r: 'b', t: botLocal(t) });
      BUSY = 0;
      r();
    }, 220);
    return;
  }
  const lg = curL(), tu = lg.tutor;
  const n = Object.keys(LS().done).length, lv = n < 6 ? 'A1' : n < 24 ? 'A2' : 'B1';
  const tp = Object.keys(LS().done).map(i => U()[i].n).join(', ') || 'basic greetings';
  const hist = LS().chat.slice(-9, -1).map(m => (m.r === 'u' ? 'Learner: ' : tu.name + ': ') + m.t.split('
')[0]).join('
');
  const P = `You are ${tu.name}, a warm ${lg.name} tutor chatting with ${S.name} (level ${lv}, studied: ${tp}). Reply format: line 1 = simple ${lg.name} reply (max 2 short sentences + short question); line 2 = "EN: " English translation; line 3 (only if learner made a mistake) = "Correction: " corrected sentence + short English tip. Under 60 words, no markdown.

${hist}
Learner: ${t}
${tu.name}:`;
  try {
    const o = await AI(P, { cache: false, modelTier: 'quick', onText: ({ text }) => { const e = $('#live'); if (e) e.textContent = text; } });
    LS().chat.push({ r: 'b', t: String(o.text || o).trim() });
  } catch (e) {
    LS().chat.push({ r: 'b', t: botLocal(t) });
  }
  BUSY = 0;
  LS().chat = LS().chat.slice(-40);
  r();
}

  dlg('Erase all progress?',
    `<p class='s'>This clears your XP, streak, and progress for Italian, Spanish, and French on this device.</p>`,
    `<button class='btn red' onclick="localStorage.removeItem('parla_v2');localStorage.removeItem('it');location.reload()">Erase everything</button><button class='x' style='width:100%;margin-top:8px' onclick='closeM()'>Cancel</button>`
  );
}
function quit() {
  dlg('Quit lesson?', `<p class='s'>You’ll lose progress in this lesson.</p>`,
    `<button class='btn' onclick='closeM()'>Keep learning</button><button class='x' style='width:100%;margin-top:8px;color:var(--r)' onclick='M=null;scr="home";r()'>Quit</button>`
  );
}

/* ================= MAIN RENDER LOOP ================= */
function r() {
  if (scr === 'home' && !S.name) scr = 'welcome';
  save();
  const A = $('#app');
  let h = '';

  if (scr === 'home') h = home();
  else if (scr === 'streak') h = streakUI();
  else if (scr === 'welcome') h = welcome();
  else if (scr === 'intro') {
    const u = U()[I], lg = curL();
    h = `<div class='top'><button class='x' onclick="scr='home';r()">${ic('back', 24)}</button><span>${lg.flag} Unit ${I + 1}</span><span style='width:28px'></span></div>
      <div class='c screen-anim'>${mascot('happy', 76)}<h1 style='margin:6px 0 4px'>${esc(u.n)}</h1><p class='s'>Tap any word to hear pronunciation.</p></div>
      ${u.g ? `<div class='card' style='border-color:color-mix(in srgb,var(--b) 40%,var(--bd))'>
        <div style='font-weight:800;font-size:14px;color:var(--b);margin-bottom:4px'>💡 Grammar &amp; Usage Tip</div>
        <div style='font-size:14px'>${esc(u.g)}</div>
      </div>` : ''}
      ${u.w.map((w, k) => `<div class='w' onclick="say(U()[I].w[${k}][0])"><b>${ic('volume', 16)} ${esc(w[0])}</b><span>${esc(w[1])}</span></div>`).join('')}
      <h2>Example sentences</h2>
      ${u.s.map(x => `<div class='w' data-t='${esc(x[0])}' onclick='say(this.dataset.t)'><b style='font-size:16px'>${ic('volume', 16)} ${esc(x[0])}</b></div><p class='s' style='margin:2px 4px 10px'>${esc(x[1])}</p>`).join('')}
      <div class='foot'>
        ${I > 0 && !LS().done[I - 1]
          ? `<p class='s c' style='margin:0 0 8px'>Locked. Pass a quick test to jump straight here.</p><button class='btn' onclick='start(1)'>Test out to unlock</button>`
          : `<button class='btn' onclick='start()'>Start lesson</button><button class='x' style='width:100%;margin-top:6px;font-size:14px' onclick='start(1)'>${ic('skip', 15)} I know this, test out</button>`}
      </div>`;
  } else if (scr === 'lesson') {
    const c = cur(), m = c.t === 'm', lg = curL();
    h = `<div class='top'>
        <button class='x' onclick='quit()'>${ic('x', 22)}</button>
        <div class='bar'><i style='width:${L.ok / Math.max(L.n, 1) * 100}%'></i></div>
        <button class='x' style='font-size:13px;display:inline-flex;align-items:center;gap:4px' onclick='say(cur().say,true)'>${ic('volume', 17)} Slow</button>
      </div>
      <div class='screen-anim'>
      <div class='lab' style='margin-top:8px'>${esc(c.lab)}</div>`;

    if (c.t === 't') {
      h += `<div class='q'>${esc(c.p)}</div>
        ${c.auto ? `<button class='say' onclick='say(cur().say)'><span class='eq'><b></b><b></b><b></b></span> Play audio</button>` : ''}
        <input id='inp' class='inp' value='${esc(L.sel || '')}' ${L.res ? 'disabled' : ''} placeholder='Type in ${lg.name}…' autocomplete='off' autocapitalize='none' autocorrect='off' spellcheck='false' oninput='L.sel=this.value' onkeydown='if(event.key==="Enter")L.res?next():check()'>
        <div class='bank' style='margin-top:12px'>${lg.chars.map(ch => `<button class='chip' onclick='ins(this.textContent)'>${ch}</button>`).join('')}</div>`;
    } else if (c.t === 's') {
      h += `<div class='q'>${esc(c.say)}</div><div class='lab'>${esc(c.p)}</div>
        <button class='say' onclick='say(cur().say)'><span class='eq'><b></b><b></b><b></b></span> Listen first</button>
        <div class='c'>
          <button class='mic ${L.live ? 'on' : ''}' onclick='listen()'>${ic('mic', 38)}</button>
          <p class='s' id='heard'>${L.live ? 'Listening… speak now' : L.sel && L.sel !== '__ok' ? 'I heard: “' + esc(L.sel) + '”' : L.msg || `Tap the mic and say it in ${lg.name}`}</p>
          ${L.nomic && !L.res ? `<button class='x' style='font-size:14px;text-decoration:underline' onclick='sOk()'>I said it out loud ${ic('check', 15)}</button>` : ''}
        </div>`;
    } else if (m && c.chat) {
      h += `<div class='chat'>
          <div class='cav' style='background:${c.chat[2]};color:#fff'>${c.chat[0]}</div>
          <div><small class='mu'>${esc(c.chat[1])} · ${lg.name} Tutor</small>
            <div class='cb'>${esc(c.p)} <button class='x' style='padding:0 4px' onclick='say(cur().say)'>${ic('volume', 18)}</button></div>
          </div>
        </div>
        <p class='lab' style='margin:14px 0 8px'>What did ${esc(c.chat[1])} say?</p>` +
        c.o.map((o, k) => `<button class='opt ${L.sel === k ? 'sel' : ''}' onclick='pick(${k})'>${esc(o)}</button>`).join('');
    } else if (m) {
      h += `<div class='q'>${esc(c.p)}</div>
        <button class='say' onclick='say(cur().say)'><span class='eq'><b></b><b></b><b></b></span> ${c.auto ? 'Play' : 'Listen'}</button>` +
        c.o.map((o, k) => `<button class='opt ${L.sel === k ? 'sel' : ''}' onclick='pick(${k})'>${esc(o)}</button>`).join('');
    } else {
      const s = L.sel || [];
      h += `<div class='q'>${esc(c.p)}</div>
        ${c.rev ? `<button class='say' onclick='say(cur().say)'><span class='eq'><b></b><b></b><b></b></span> Listen</button>` : ''}
        <div class='ans'>${s.map((k, j) => `<button class='chip' onclick='unpick(${j})'>${esc(c.o[k])}</button>`).join('')}</div>
        <div class='bank'>${c.o.map((o, k) => `<button class='chip ${s.includes(k) ? 'used' : ''}' onclick='pick(${k})'>${esc(o)}</button>`).join('')}</div>`;
    }
    h += `</div>`;
    const has = c.t === 't' || (m || c.t === 's' ? L.sel !== null : (L.sel || []).length > 0);
    const ans = c.t === 'b' ? c.a.join(' ') : c.a;
    h += `<div class='foot ${L.res || ''}'>
      ${L.res
        ? `<div class='fb'>${mascot(L.res === 'ok' ? 'cheer' : 'sad', 44)}
            <div>
              <div>${L.res === 'ok' ? lg.praise[L.ok % lg.praise.length] + (L.cb > 2 ? ` · ${L.cb} in a row!` : '') : 'Correct: ' + esc(ans)}</div>
              ${L.accentHint ? `<small style='font-weight:600'>Accent tip: ${esc(L.accentHint)}</small>` : ''}
            </div>
          </div>
          <button class='btn ${L.res === 'no' ? 'red' : ''}' onclick='next()'>Continue</button>`
        : `<button class='btn' ${has ? '' : 'disabled'} onclick='check()'>Check</button>
          ${c.t === 's' || c.auto ? `<button class='x' style='width:100%;margin-top:6px;font-size:13px' onclick='skipEx()'>Can’t speak or listen now, skip</button>` : ''}`}
    </div>`;
  } else if (scr === 'blitz' && BLITZ) {
    const c = BLITZ.card;
    h = `<div class='top'>
        <button class='x' onclick="clearInterval(window._bt);scr='home';r()">${ic('x', 22)}</button>
        <span style='font-weight:800;color:var(--b)'>⚡ ${BLITZ.score} pts ${BLITZ.combo >= 3 ? '(x' + (BLITZ.combo >= 5 ? 3 : 2) + ')' : ''}</span>
        <span id='btime' style='font-weight:800;color:var(--r)'>${BLITZ.left}s</span>
      </div>
      <div class='bar' style='height:8px;margin-bottom:8px'><i id='bbar' style='width:${Math.max(0, BLITZ.left / 60 * 100)}%;background:linear-gradient(90deg,#f59e0b,#ef4444)'></i></div>
      <div class='c screen-anim' style='margin-top:16px'>
        <small class='mu'>TAP THE MATCHING TRANSLATION</small>
        <div class='q' style='font-size:28px;margin:14px 0 20px'>${esc(c.p)}</div>
        ${c.opts.map(o => `<button class='opt c' style='text-align:center;font-weight:700' data-o='${esc(o)}' onclick='ansBlitz(this.dataset.o)'>${esc(o)}</button>`).join('')}
      </div>`;
  } else if (scr === 'story' && STORY) {
    const st = curL().stories[STORY.idx];
    const shown = st.lines.slice(0, STORY.step + 1);
    h = `<div class='top'><button class='x' onclick="scr='home';r()">${ic('back', 24)}</button><span>${esc(st.title)}</span><span class='mu'>${st.level}</span></div>
      <div class='screen-anim'>
      ${shown.map(ln => `<div class='card' style='cursor:pointer' data-t='${esc(ln.text)}' onclick='say(this.dataset.t)'>
        <small class='mu'>${esc(ln.who)} · ${ic('volume', 14)} Tap to listen</small>
        <div style='font-weight:700;font-size:17px;margin-top:4px'>${esc(ln.text)}</div>
        <div class='mu2'>${esc(ln.en)}</div>
      </div>`).join('')}
      ${STORY.step >= st.lines.length ? `<div class='card' style='border-color:var(--b)'>
        <div style='font-weight:800;margin-bottom:10px'>Comprehension check: ${esc(st.q)}</div>
        ${st.opts.map((o, k) => `<button class='opt ${STORY.ans === k ? 'sel' : ''}' onclick='ansStory(${k})'>${esc(o)}</button>`).join('')}
        ${STORY.ans !== null ? `<div style='font-weight:700;color:${STORY.ans === st.ans ? 'var(--g)' : 'var(--r)'}'>${STORY.ans === st.ans ? 'Correct! +15 XP' : 'Try another option above!'}</div>` : ''}
      </div>` : ''}
      </div>
      <div class='foot'>
        ${STORY.step < st.lines.length
          ? `<button class='btn' onclick='nextStoryLine()'>Continue story</button>`
          : `<button class='btn' onclick="scr='home';r()">Finish story</button>`}
      </div>`;
  } else if (scr === 'cards') {
    const card = FC.deck[FC.idx];
    h = `<div class='top'><button class='x' onclick="scr='home';r()">${ic('back', 24)}</button><span>3D Flashcards</span><span class='mu'>${FC.idx + 1}/${FC.deck.length}</span></div>
      <div class='screen-anim'>
        <div class='fc-wrap'>
          <div class='fc ${FC.flip ? 'flipped' : ''}' onclick='flipCard()'>
            <small class='mu'>${FC.flip ? 'ENGLISH MEANING' : curL().name.toUpperCase() + ' · TAP TO FLIP'}</small>
            <div style='font-size:28px;font-weight:800;margin:14px 0'>${esc(card ? card[FC.flip ? 1 : 0] : '')}</div>
            <button class='chip' style='font-size:14px;color:var(--b)' onclick='event.stopPropagation();say(FC.deck[FC.idx][0])'>${ic('volume', 16)} Listen</button>
          </div>
        </div>
        <div class='grid'>
          <button class='btn red' onclick='stepCard(true)'>Practice again</button>
          <button class='btn' onclick='stepCard(false)'>Got it ✓</button>
        </div>
      </div>`;
  } else if (scr === 'end') {
    h = `<div class='c screen-anim' style='margin-top:32px'>${mascot('cheer', 124)}
      <h1>Lesson complete!</h1>
      <div>
        <span class='stat'>${ic('star', 17)} +${L.gain} XP</span>
        <span class='stat'>${L.err ? 'Keep practising' : 'Perfect!'}</span>
        <span class='stat'>${ic('flame', 17)} ${S.streak}</span>
      </div>
      ${L.new.length ? `<p class='c'><b>New badge!</b><br>${L.new.join('<br>')}</p>` : ''}
    </div>
    <div class='foot'><button class='btn' onclick="scr='home';r()">Continue</button></div>`;
  } else if (scr === 'qres') {
    const o = L.out, g = o.pass || o.k !== 'quiz';
    const ttl = { daily: 'Daily Warm-Up complete', quiz: o.pass ? 'Chapter quiz passed!' : 'Almost there', free: 'Review complete' }[o.k];
    h = `<div class='c screen-anim' style='margin-top:32px'>${mascot(g ? 'cheer' : 'think', 114)}
      <h1>${ttl}</h1>
      <div style='font-size:52px;font-weight:800;margin:8px 0;color:${g ? 'var(--g)' : 'var(--r)'}'>${o.pct}%</div>
      <span class='stat'>${ic('star', 17)} +${o.xp} XP</span>
      <span class='stat'>${ic('flame', 17)} ${S.streak} day streak</span>
    </div>
    <div class='foot'>
      ${o.k === 'quiz' && !o.pass
        ? `<button class='btn' onclick='startQuiz(${L.ch})'>Try again</button><button class='x' style='width:100%;margin-top:6px' onclick="scr='home';r()">Back</button>`
        : `<button class='btn' onclick="scr='home';r()">Continue</button>`}
    </div>`;
  } else if (scr === 'fail') {
    h = `<div class='c screen-anim' style='margin-top:36px'>${mascot('sad', 124)}
      <h1>Out of hearts</h1>
      <p class='s'>Review the unit vocabulary and try again.</p>
    </div>
    <div class='foot'><button class='btn' onclick="scr='intro';r()">Review &amp; retry</button></div>`;
  }

  const pv = A.querySelector('.sc'), st = pv ? pv.scrollTop : 0;
  A.innerHTML = h + (M || '');
  const scEl = document.createElement('div');
  scEl.className = 'sc';
  [...A.children].forEach(n => { if (!n.matches('.foot,.tabs,.mo')) scEl.appendChild(n); });
  A.prepend(scEl);
  const k = scr + S.tab + S.lang;
  scEl.scrollTop = scr === 'home' && S.tab === 'chat' ? 1e9 : (window._ps === k ? st : 0);
  window._ps = k;
  const ip = $('#inp');
  if (ip && !L.res && !M) ip.focus();
}

// Immediate Tutor initialization (no 1.5s hang on GitHub Pages)
const initAI = async () => {
  if (window.claude && typeof window.claude.use === 'function') {
    try { AI = (await window.claude.use('sample')) || false; } catch (e) { AI = false; }
  } else {
    AI = false;
  }
  if (scr === 'home' && S.tab === 'chat' && !BUSY) r();
};

// Mobile touch swipe gestures (back navigation + 3D flashcard thumb swipe)
(() => {
  let sx = 0, sy = 0;
  document.addEventListener('touchstart', e => {
    if (e.touches.length === 1) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (!sx || e.changedTouches.length !== 1) return;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    sx = 0;
    if (Math.abs(dx) < 65 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
    if (scr === 'cards') {
      stepCard(dx < 0);
    } else if (dx > 75 && (scr === 'intro' || scr === 'streak' || scr === 'story')) {
      scr = 'home';
      r();
    }
  }, { passive: true });
})();

initAI();
r();
</script>
